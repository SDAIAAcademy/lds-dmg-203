<section>
<h2>اليوم 1: من المتطلبات إلى القواعد</h2>
<ol>
<li><p>أعدت حساب تصاريح مقدمي الرعاية السارية بالتعريف المعتمد فوجدت 765، والتقرير المنشور 786. لم تبحث بعدُ في الصفوف. أي رسالة أصح؟</p><ul><li><b>أ.</b> في التقرير 21 تصريحًا مكررًا يجب حذفها</li><li><b>ب.</b> التقرير أعلى بـ 21 تصريحًا (2.7%)، والسبب قيد التنميط</li><li><b>ج.</b> الفرق أقل من 3%، فلا حاجة لإبلاغ أحد</li><li><b>د.</b> انشر رقم المصدر 765 مكان رقم التقرير فورًا، وأبلغ القراء بالتصحيح</li></ul></li>
<li><p>في سجل التصاريح أربعة أعمدة مرشحة، ومكانك لعنصر واحد. أيها أولى بالدخول؟</p><ul><li><b>أ.</b> ملاحظات المشرف، لأن نصف خاناتها فارغة فهي الأسوأ اكتمالًا</li><li><b>ب.</b> رقم التصريح، لأن فحص صيغته أسهل</li><li><b>ج.</b> تاريخ شهادة الإسعافات، لأن عليه يقوم قرار سلامة</li><li><b>د.</b> ساعات التدريب، لأنها في التقرير السنوي للتدريب</li></ul></li>
<li><p>متطلب مديرة شؤون الكوادر: «لا يُحسب في المناوبة إلا من تصريحه ساري.» أي صياغة قاعدة يمكن تشغيلها كما هي؟</p><ul><li><b>أ.</b> بيانات التصاريح دقيقة ومحدثة دائمًا</li><li><b>ب.</b> عمود status في جدول التصاريح يُراجع شهريًا</li><li><b>ج.</b> نسبة التصاريح السارية في السجل لا تقل عن 95%</li><li><b>د.</b> التصاريح بحالة ACTIVE تاريخ انتهائها لا يسبق يوم الفحص؛ الاجتياز 100% يوميًا</li></ul></li>
<li><p>اكتمال تاريخ شهادة الإسعافات اليوم 96.2%، وكان أدنى في بعض الأشهر. مديرة شؤون الكوادر تقول إن كل تصريح كامل بلا شهادة يمنع حسابه في المناوبة. ما المعيار المناسب؟</p><ul><li><b>أ.</b> 96%، لأنه ما نحققه اليوم</li><li><b>ب.</b> 100%، واستثناء مؤقت مكتوب لما سبق الإلزام</li><li><b>ج.</b> 95%، أدنى شهر مر بنا هذه السنة</li><li><b>د.</b> 100% لكل التصاريح بلا استثناء، ومنها ما صدر قبل الإلزام بالحقل</li></ul></li>
<li><p>تقرير الكوادر الشهري يعد مقدمي الرعاية بتصاريح سارية. أعدت الحساب بتعريف التقرير فوجدت عددًا أقل منه بـ 2%. ما الخطوة التالية الأصح؟</p><ul><li><b>أ.</b> تحذف 2% من الصفوف عشوائيًا ليتطابق الرقمان</li><li><b>ب.</b> تنشر رقمك المعاد حسابه مكان رقم التقرير</li><li><b>ج.</b> تبلّغ المالكة بالفرق وتبدأ التنميط لتعرف سببه</li><li><b>د.</b> تتجاهل الفرق لأنه دون 5% من التصاريح</li></ul></li>
<li><p>في سجل التصاريح عمود «لون بطاقة الموظف» يستخدمه قسم الأمن لطباعة البطاقات فقط، وعمود «تاريخ انتهاء التصريح» يستخدمه التقرير والمناوبات والتفتيش. أيهما عنصر حرج؟</p><ul><li><b>أ.</b> تاريخ الانتهاء: عليه ثلاثة قرارات أحدها سلامة</li><li><b>ب.</b> كلاهما، لأن لكل منهما مستهلكًا يعتمد عليه في عمله</li><li><b>ج.</b> لون البطاقة، لأن قياس صلاحيته أسهل</li><li><b>د.</b> لا أحدهما حتى يُكتب كتالوج القواعد كاملًا</li></ul></li>
<li><p>أي صياغة لقاعدة اكتمال في سجل التصاريح فيها كل ما تطلبه مواصفة قواعد الجودة؟</p><ul><li><b>أ.</b> تاريخ الإسعافات مهم لسلامة الأطفال، ويجب أن تحرص المراكز على تعبئته دائمًا</li><li><b>ب.</b> تاريخ الإسعافات يُراجع كل أسبوع في اجتماع الكوادر، ويُبلَّغ المالك بالملاحظات المهمة</li><li><b>ج.</b> تاريخ الإسعافات غير فارغ في 100% من صفوف السجل كله، أيًا كان نوع التصريح</li><li><b>د.</b> غير فارغ للتصاريح الكاملة؛ المملوء ÷ النطاق؛ تنبيه دون 95%؛ صاحبها محلل الجودة</li></ul></li>
<li><p>اقترح مساعد ذكاء اصطناعي قاعدة: «لا يتكرر رقم مقدم الرعاية في جدول التصاريح». مقدم الرعاية قد يعمل في مركزين بتصريحين. ما حكمك؟</p><ul><li><b>أ.</b> قبول، لأن التفرد بعد من الأبعاد الستة المعتمدة وطنيًا</li><li><b>ب.</b> تعديل: تصريح ساري واحد لكل مقدم رعاية في المركز</li><li><b>ج.</b> رفض، لأن اقتراحات المساعدات لا تُقبل في الجهة</li><li><b>د.</b> قبول بعتبة 90% لتمر الحالات المشروعة</li></ul></li>
<li><p>خط أساس قاعدة «إدخال التصريح خلال يومين» 88%، وقسم المناوبات يحتاج 97% ليبني جداوله. ما المعيار الذي تقترحه على المالكة؟</p><ul><li><b>أ.</b> 88%، حتى تنجح القاعدة من اليوم الأول وتطمئن المالكة</li><li><b>ب.</b> 97%، والقاعدة ستفشل حتى يتحسن الإدخال</li><li><b>ج.</b> 92%، في منتصف الطريق بين خط الأساس والحاجة</li><li><b>د.</b> 100%، فلا يُقبل أي تأخير في أي تصريح كان</li></ul></li>
<li><p>تصاريح المساعدين الصادرة قبل 2025 لم يكن تاريخ الإسعافات مطلوبًا فيها. كيف تعامل قاعدة الاكتمال معها؟</p><ul><li><b>أ.</b> تخفض المعيار لكل التصاريح إلى ما تحققه</li><li><b>ب.</b> تحذف القاعدة حتى تنتهي تلك التصاريح</li><li><b>ج.</b> تعدها فشلًا وتصعّد كل شهر</li><li><b>د.</b> استثناء مكتوب لنطاقها، بسبب وتاريخ انتهاء ومالك</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: التنميط والتنفيذ وبطاقة الأداء</h2>
<ol>
<li><p>أربع صيغ لقاعدة على تاريخ انتهاء شهادة الإسعافات في سجل التصاريح. أيها يمكن أن يشغّله محلل الغد دون أن يسأل أحدًا؟</p><ul><li><b>أ.</b> التصاريح السارية: تاريخ الشهادة غير فارغ، المعيار 95%، التصعيد تحت 90%، أسبوعيًا، المالك مدير التصاريح</li><li><b>ب.</b> يجب أن تكون شهادات الإسعافات محدثة دائمًا</li><li><b>ج.</b> تاريخ الشهادة غير فارغ في التصاريح السارية</li><li><b>د.</b> نسبة الاكتمال لا تقل عن خط الأساس الحالي</li></ul></li>
<li><p>نسخة من سجل التصاريح وصلت من فرع، عمود permit_type: الفراغ 0، والتميز 4، والأكثر شيوعًا FULL ×980، ASSIST ×470، full ×40، مساعد ×19. القاموس يقول FULL أو ASSIST. ما الحكم؟</p><ul><li><b>أ.</b> العمود مكتمل وصالح، ولا عيب فيه</li><li><b>ب.</b> موظف واحد أدخل 59 تصريحًا بطريقة خاطئة، ويجب تدريبه</li><li><b>ج.</b> عيب صلاحية في قيمتين، أي 2 من 4</li><li><b>د.</b> عيب صلاحية في 59 صفًا: قيمتان خارج القائمة تعنيان ما في القائمة</li></ul></li>
<li><p>زار المفتشون 50 مقدم رعاية مختارين عشوائيًا، فوجدوا 3 يعملون في مركز غير المسجل في تصاريحهم. السجل فيه 1,509 تصاريح. أي جملة أصح؟</p><ul><li><b>أ.</b> نحو 6% مركزها خاطئ، والمجال واسع: من نحو 2% إلى 16%</li><li><b>ب.</b> 90 تصريحًا بالضبط مركزها خاطئ</li><li><b>ج.</b> 50 زيارة لا تعني شيئًا، ولا يُستنتج منها</li><li><b>د.</b> نترك العينة ونشغّل استعلامًا على السجل كله يقارن المركز بالتصريح، فهو أدق</li></ul></li>
<li><p>كتالوج التصاريح 12 قاعدة. السطر الأخير من التشغيل: PASS 9 FAIL 0 ERROR 0 NOT RUN 3. مديرك يسأل: «هل نعلن أن البيانات اجتازت كل الفحوص؟»</p><ul><li><b>أ.</b> نعم، لا قاعدة فشلت</li><li><b>ب.</b> نعم، نسبة النجاح 100% من الفحوص</li><li><b>ج.</b> لا: ثلاث لم تُشغَّل</li><li><b>د.</b> لا: ثلاث قواعد فشلت، والنتيجة 9 من 12</li></ul></li>
<li><p>بطاقة التصاريح تقول: «الإجمالي 99.0% أخضر، الاتساق 97.7% أخضر». عتبة قاعدة الاتساق 100. لديك وقت لتغيير واحد قبل الاجتماع. أيها؟</p><ul><li><b>أ.</b> تكبير الخط وإضافة رسم بياني ملون</li><li><b>ب.</b> عنوان بعدد القواعد التي بلغت عتبتها، وبجانب كل نسبة عتبتها</li><li><b>ج.</b> حذف القواعد الناجحة وعرض الفاشلة فقط، فيرى المدير ما يحتاج قرارًا</li><li><b>د.</b> عرض النسب بثلاث خانات عشرية بدل واحدة</li></ul></li>
<li><p>تنميط عمود «ساعات التدريب» في سجل التصاريح: لا فراغ، والأدنى 0، والأكثر شيوعًا 12. ما الذي يستحق استعلامًا أولًا؟</p><ul><li><b>أ.</b> القيم 0: قد تكون بديلًا للفراغ</li><li><b>ب.</b> القيمة 12 لأنها الأكثر شيوعًا بين الصفوف</li><li><b>ج.</b> لا شيء، فالعمود مكتمل ولا فراغ فيه</li><li><b>د.</b> القيمة العليا لأنها أبعد القيم عن المتوسط</li></ul></li>
<li><p>عمود الحالة في سجل التصاريح فيه ACTIVE وEXPIRED وActive. ماذا يقول التنميط؟</p><ul><li><b>أ.</b> لا شيء، فالحالة مفهومة لأي قارئ للسجل</li><li><b>ب.</b> عيب اكتمال، لأن قيمة الحالة ناقصة</li><li><b>ج.</b> عيب صلاحية: قيمة خارج القائمة تكسر العدّ</li><li><b>د.</b> عيب دقة، لأن الحالة لا تطابق الواقع في المركز</li></ul></li>
<li><p>في سجل التصاريح عمود centre_id يشير إلى جدول المراكز. ما الاستعلام الذي يكشف الصفوف اليتيمة؟</p><ul><li><b>أ.</b> عدّ القيم الفارغة في عمود centre_id</li><li><b>ب.</b> عدّ المراكز التي ليس لها تصريح</li><li><b>ج.</b> عدّ التصاريح المكررة لكل مركز</li><li><b>د.</b> عدّ التصاريح التي لا يوجد مركزها في جدول المراكز</li></ul></li>
<li><p>عينة عشوائية من 50 تصريحًا تحقق منها المفتشون، فوجدوا 3 بشهادة غير موجودة فعلًا. ما الذي يُكتب في التقرير؟</p><ul><li><b>أ.</b> 6% من كل التصاريح بشهادة غير موجودة، وتُبلَّغ هكذا</li><li><b>ب.</b> 3 تصاريح فقط بها مشكلة في السجل كله</li><li><b>ج.</b> 6%، بمجال ثقة 95% من نحو 2% إلى 16%، من عينة 50</li><li><b>د.</b> لا يُكتب شيء حتى يُفحص السجل كاملًا في الميدان</li></ul></li>
<li><p>سجل التشغيل لكتالوج من 18 قاعدة فيه 16 سطرًا: قاعدتان لم تُكتب لهما فحوص بعد. كيف تظهران في السجل؟</p><ul><li><b>أ.</b> تُحذفان من السجل حتى تُكتب فحوصهما</li><li><b>ب.</b> تظهران بنتيجة «لم تُشغَّل» مع السبب</li><li><b>ج.</b> تُعدان ناجحتين لأنهما لم تفشلا في التشغيل</li><li><b>د.</b> تُدمجان في قاعدة قريبة منهما</li></ul></li>
<li><p>قاعدة فحص على جدول التصاريح تفشل في 40 صفًا. ماذا يضع سجل التشغيل بجانب النتيجة؟</p><ul><li><b>أ.</b> أرقام بعض التصاريح الفاشلة</li><li><b>ب.</b> أسماء مقدمي الرعاية ليعرف المشرف بمن يتصل</li><li><b>ج.</b> الصفوف الأربعون كاملة بكل أعمدتها</li><li><b>د.</b> لا شيء، فعدد الصفوف الفاشلة يكفي</li></ul></li>
<li><p>بطاقة أداء سجل التصاريح تعرض رقمًا واحدًا: 98.9% من الصفوف ناجحة. ثلاث قواعد من عشر دون معيارها، إحداها قاعدة سلامة. ما الإصلاح الأهم؟</p><ul><li><b>أ.</b> عدد القواعد المحققة لمعاييرها، وأسوؤها أولًا بمالكه</li><li><b>ب.</b> لون أخضر للبطاقة لأن الرقم مرتفع</li><li><b>ج.</b> حذف قاعدة السلامة لأنها تخفض الرقم العام للبطاقة كل شهر</li><li><b>د.</b> تقريب الرقم إلى 99% ليسهل تذكره</li></ul></li>
<li><p>بطاقة تقول «الاكتمال 99%» دون مقام. ما الذي تحتاجه لتصدقها؟</p><ul><li><b>أ.</b> لون البطاقة ومقارنته بألوان الشهر الماضي</li><li><b>ب.</b> الصفوف المفحوصة، والعتبة، وتاريخ التشغيل</li><li><b>ج.</b> اسم الأداة التي حسبتها وإصدارها</li><li><b>د.</b> متوسط الأبعاد الخمسة الأخرى في البطاقة</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: المشكلات والتشغيل والذكاء الاصطناعي</h2>
<ol>
<li><p>سجل تشغيل التصاريح: قاعدة «التصريح الساري لم ينته تاريخه» تفشل في 18 من 786. أي جملة يسندها هذا السجل وحده؟</p><ul><li><b>أ.</b> موظفو التصاريح ينسون تحديث الحالة</li><li><b>ب.</b> 18 مقدم رعاية يعملون اليوم بلا تصريح</li><li><b>ج.</b> القاعدة ناجحة عمليًا: 18 من 786 أقل من 3%، والعتبة 100 تُقرأ تقريبًا</li><li><b>د.</b> 18 تصريحًا حالتها ساري وتاريخها انتهى، ويلزم بحث في السبب</li></ul></li>
<li><p>سجل التشغيل: 22 تصريحًا من 1,509 بساعات تدريب صفر (1.5%). الحقل تستعمله خطة التدريب السنوية الداخلية فقط، ولا يدخل قرار إصدار التصريح ولا المناوبات. وصل بلاغ واحد من إدارة التدريب. ما الخطورة بحسب الدليل؟</p><ul><li><b>أ.</b> منخفضة: لا قرار خاطئ عن أي شخص</li><li><b>ب.</b> متوسطة: أثر متوسط، وبلاغ واحد فالامتداد محدود</li><li><b>ج.</b> عالية: أثر متوسط وامتداد واسع (1.5%)</li><li><b>د.</b> حرجة: كل ما يتعلق بمقدمي الرعاية يمس السلامة</li></ul></li>
<li><p>تحليل لساعات تدريب صفرية في تصاريح جديدة انتهى عند: «الموظف لا يكتب الساعات لأن الحقل اختياري ويقبل الصفر افتراضيًا». ما الإجراء الوقائي الأنسب؟</p><ul><li><b>أ.</b> تدريب الموظفين على أهمية الحقل</li><li><b>ب.</b> الحقل إلزامي بلا قيمة افتراضية، والتحقق يرفض ما دون الحد</li><li><b>ج.</b> تصحيح التصاريح الـ 22 يدويًا من ملفات التدريب</li><li><b>د.</b> قاعدة أسبوعية تنبّه على كل صفر جديد في السجل، ويصححه المشرف خلال يوم</li></ul></li>
<li><p>مستخرج التصاريح للنشر: فحص التكرار يجد 9 صفوف، وفحص المراكز الصغيرة يجد 4 مراكز فيها مقدم رعاية واحد أو اثنان، والبقية تنجح. الموعد غدًا. ما القرار؟</p><ul><li><b>أ.</b> انشر في الموعد مع ملاحظة عن العيبين</li><li><b>ب.</b> أوقف النشر حتى المراجعة الربعية</li><li><b>ج.</b> احذف الصفوف المكررة التسعة وانشر كما هو</li><li><b>د.</b> انشر بعد حذف المكرر وجمع المراكز الأربعة الصغيرة على مستوى أعلى</li></ul></li>
<li><p>جدول لتدريب نموذج يتنبأ بمن سيرسب في اختبار الإسعافات. عمود retake_booked (حُجز موعد إعادة): «نعم» يرسب منهم 92%، و«لا» يرسب 0%. ما الصواب؟</p><ul><li><b>أ.</b> إبقاؤه، فهو أقوى عمود في الجدول</li><li><b>ب.</b> استبعاده قبل التدريب</li><li><b>ج.</b> إبقاؤه بوزن أقل في النموذج</li><li><b>د.</b> حذف الصفوف المكررة ثم إبقاؤه</li></ul></li>
<li><p>صحح المشرف 25 تصريحًا كانت حالتها ساريةً وهي منتهية، والمهمة الليلية التي تحدّث الحالة ما زالت معطلة. هل تُغلق المشكلة؟</p><ul><li><b>أ.</b> نعم، فالصفوف الخمسة والعشرون صُححت</li><li><b>ب.</b> نعم، وتُفتح مشكلة جديدة إن تكرر الخطأ</li><li><b>ج.</b> لا: حتى يُصلح السبب ويثبت القياس</li><li><b>د.</b> تُغلق إذا وافق المشرف على الإغلاق</li></ul></li>
<li><p>ثلاثة بلاغات من ثلاثة مراكز عن تصاريح مقدمي رعاية لا تظهر في البوابة، والسبب واحد. كيف تُسجَّل؟</p><ul><li><b>أ.</b> ثلاث مشكلات منفصلة بثلاثة ملاك مختلفين</li><li><b>ب.</b> تُرفض لأنها جاءت من خارج مكتب البيانات</li><li><b>ج.</b> تُغلق اثنتان وتبقى واحدة مفتوحة دون ربط بينها</li><li><b>د.</b> مشكلة واحدة، والبلاغان الآخران مربوطان بها</li></ul></li>
<li><p>تصاريح كثيرة تُسجَّل بنوع ASSIST مع أن مقدميها مؤهلون لـ FULL. التقسيم يُظهر أن كلها من نموذج إلكتروني واحد صدر في مارس. ما الخطوة التالية؟</p><ul><li><b>أ.</b> تدريب الموظفين على الإدخال الصحيح</li><li><b>ب.</b> تصحيح الصفوف وإغلاق المشكلة</li><li><b>ج.</b> قراءة مواصفة النموذج: قيمته الافتراضية والتحقق فيه</li><li><b>د.</b> إضافة قاعدة تنبيه شهرية على النوع</li></ul></li>
<li><p>أي مقياس تكرار يثبت أن الإجراء الوقائي لنموذج التصاريح نجح؟</p><ul><li><b>أ.</b> عدد التصاريح المصححة يدويًا منذ اكتشاف الخطأ في النموذج الإلكتروني</li><li><b>ب.</b> عدد الاجتماعات التي عُقدت مع فريق النموذج الإلكتروني</li><li><b>ج.</b> رضا الموظفين عن النموذج الجديد في استبانة بعد شهر</li><li><b>د.</b> نسبة الطلبات الجديدة كل أسبوع التي تفشل قاعدة النوع، وهدفها صفر</li></ul></li>
<li><p>جدول لتدريب نموذج يرتب مقدمي الرعاية للتدريب الإضافي. أصحاب التصاريح المساعدة (ASSIST) 3% من صفوفه و30% من مقدمي الرعاية. ما الفجوة؟</p><ul><li><b>أ.</b> التمثيل: النموذج يتعلم قليلًا عن فئة كبيرة فقد يظلمها</li><li><b>ب.</b> التسرب، لأن في الجدول عمودًا من المستقبل</li><li><b>ج.</b> ضوضاء التسميات، لأن التقييمات مختلفة</li><li><b>د.</b> التكرار، لأن صفوفًا تتكرر</li></ul></li>
<li><p>في جدول التدريب نفسه عمود «أُرسل للتدريب الإضافي» يُملأ بعد قرار المشرف. النموذج الذي يستعمله يحقق دقة شبه كاملة. ما الحكم؟</p><ul><li><b>أ.</b> دليل على نموذج ممتاز يستحق النشر سريعًا</li><li><b>ب.</b> تسرب: العمود يُعرف بعد القرار فيُحذف</li><li><b>ج.</b> ضوضاء تسميات تُصلح بإعادة تقييم الصفوف كلها</li><li><b>د.</b> تكرار يُصلح بحذف الصفوف المكررة من الجدول</li></ul></li>
<li><p>مساعد يجيب المتقدمين من مجموعة وثائق فيها تعميمان عن الحد الأدنى لساعات التدريب: القديم 6 ساعات والجديد 8، دون علامة على أيهما ساري. ما الإصلاح قبل التأسيس عليها؟</p><ul><li><b>أ.</b> إبقاء الاثنين ليختار المساعد الأحدث منهما بنفسه</li><li><b>ب.</b> وسم القديم ملغى وإضافة تاريخ السريان لكل وثيقة</li><li><b>ج.</b> حذف الوثيقتين معًا من مجموعة الوثائق</li><li><b>د.</b> دمجهما في وثيقة واحدة يصوغها مساعد</li></ul></li>
<li><p>تسميات «يحتاج تدريبًا» أعاد تقييمها مشرف ثانٍ لعينة من 100، فاتفق المشرفان في 70. ما الذي يعنيه ذلك للنموذج؟</p><ul><li><b>أ.</b> ضوضاء كبيرة: يُوحّد المعيار ويُعاد التقييم</li><li><b>ب.</b> التسميات صالحة لأن الاتفاق أعلى من النصف بكثير</li><li><b>ج.</b> المشرف الثاني مخطئ، فتبقى تسميات الأول</li><li><b>د.</b> يكفي جمع صفوف أكثر حتى تتوازن الأخطاء</li></ul></li>
<li><p>مستخرج قائمة مقدمي الرعاية للنشر ينجح في كل قواعد السجل، وفيه عمود الحي لمقدمات رعاية يعملن من منازلهن. ماذا تقرر؟</p><ul><li><b>أ.</b> النشر، لأن كل قواعد السجل ناجحة</li><li><b>ب.</b> النشر بعد حذف الأسماء فقط</li><li><b>ج.</b> تأجيل القرار إلى الربع القادم</li><li><b>د.</b> إيقاف النشر حتى يُزال ما يدل على المنازل ويُراجع التصنيف</li></ul></li>
<li><p>اتفاقية لمشاركة سجل التصاريح مع جهة شريكة. أي بند جودة أنفع للطرفين؟</p><ul><li><b>أ.</b> تلتزم الهيئة بجودة البيانات المقدمة ودقتها وحداثتها واكتمالها</li><li><b>ب.</b> البيانات تُقدَّم كما هي دون أي التزام من الهيئة</li><li><b>ج.</b> يُبلَّغ الخطأ خلال خمسة أيام عمل ويُصحح في مدة متفق عليها</li><li><b>د.</b> يتحمل المستفيد مسؤولية كل خطأ يجده في البيانات</li></ul></li>
<li><p>مالكان يختلفان على أول إصلاح في سجل التصاريح، والفريق يقدر على واحد هذا الشهر. ما أفضل طريقة لحسم الخلاف؟</p><ul><li><b>أ.</b> يُختار طلب الأعلى منصبًا بين المالكين</li><li><b>ب.</b> يُختار الأقدم تسجيلًا في سجل المشكلات</li><li><b>ج.</b> يُقسم الفريق بين الإصلاحين بالتساوي</li><li><b>د.</b> معايير مكتوبة ثم التصعيد</li></ul></li>
<li><p>خطة جودة لسجل التصاريح فيها قواعد وبطاقة أداء، ولا شيء عما يحدث حين تفشل قاعدة. ما الذي ينقصها؟</p><ul><li><b>أ.</b> مسار المشكلات: الإبلاغ والمدد والتصعيد والإغلاق</li><li><b>ب.</b> قواعد أكثر تغطي كل أعمدة السجل بلا استثناء، بعتبات أعلى</li><li><b>ج.</b> لون جديد للبطاقة يلفت نظر المالكين</li><li><b>د.</b> أداة فحص أحدث من الأداة الحالية</li></ul></li>
</ol>
