# Reference checks for the 20 rules of files/day2/rules_reference.csv (lab 2.3 solution).
run_date: 2026-10-31
checks:
  - {id: R01, cde: licences.licence_no, dimension: التفرد, table: licences, type: unique, columns: [licence_no], threshold: 100, owner: محلل الجودة}
  - {id: R02, cde: licences.licence_no, dimension: الصلاحية, table: licences, type: pattern, column: licence_no, pattern: 'AKM-L-[0-9]{4}-[0-9]{5}', threshold: 100, owner: محلل الجودة}
  - {id: R03, cde: licences.status, dimension: الصلاحية, table: licences, type: in_set, column: status, values: [ACTIVE, EXPIRED, RENEWED, SUSPENDED, CANCELLED], threshold: 100, owner: محلل الجودة}
  - {id: R04, cde: licences.status, dimension: الاتساق, table: licences, type: row, where: "status = 'ACTIVE'", must: "expiry_date >= DATE '2026-10-31'", threshold: 100, owner: محلل الجودة}
  - {id: R05, cde: licences.expiry_date, dimension: الاكتمال, table: licences, type: not_null, column: expiry_date, threshold: 100, owner: محلل الجودة}
  - {id: R06, cde: licences.expiry_date, dimension: الاتساق, table: licences, type: row, must: "expiry_date = issue_date + INTERVAL 730 DAY", threshold: 99, owner: محلل الجودة}
  - {id: R07, cde: licences.licence_no, dimension: التفرد, table: licences, type: unique, columns: [application_id], where: "status = 'ACTIVE'", threshold: 100, owner: محلل الجودة}
  - {id: R08, cde: licences.capacity_licensed, dimension: الصلاحية, table: licences, type: between, column: capacity_licensed, min: 1, max: 150, threshold: 100, owner: محلل الجودة}
  - id: R09
    cde: licences.capacity_licensed
    dimension: الاتساق
    table: licences
    from: licences JOIN centres USING (centre_id)
    type: row
    where: "centre_type = 'HOME'"
    must: "capacity_licensed <= 10"
    threshold: 100
    owner: محلل الجودة
  - {id: R10, cde: centres.centre_type, dimension: الصلاحية, table: centres, type: in_set, column: centre_type, values: [CENTRE, HOME], threshold: 100, owner: محلل الجودة}
  - {id: R11, cde: centres.city_code, dimension: الصلاحية, table: centres, type: reference, column: city_code, ref_table: cities, ref_column: city_code, threshold: 100, owner: محلل الجودة}
  - {id: R12, cde: inspections.outcome, dimension: الصلاحية, table: inspections, type: in_set, column: outcome, values: [PASS, COND, FAIL], threshold: 99.5, owner: محلل الجودة}
  - id: R13
    cde: centres.city_code
    dimension: الدقة
    table: centres
    from: centres JOIN cities USING (city_code)
    type: row
    must: "length(postal_code) = 6 AND substr(postal_code, 1, 2) = postal_prefix"
    threshold: 99
    owner: محلل الجودة
  - {id: R14, cde: centres.postal_code, dimension: الصلاحية, table: centres, type: pattern, column: postal_code, pattern: '[0-9]{6}', threshold: 100, owner: محلل الجودة}
  - {id: R15, cde: centres.district_code, dimension: الصلاحية, table: centres, type: reference, column: district_code, ref_table: districts, ref_column: district_code, threshold: 99, owner: محلل الجودة}
  - id: R16
    cde: centres.district_code
    dimension: الاتساق
    table: centres
    from: centres c JOIN districts d USING (district_code)
    key: c.centre_id
    type: row
    must: "d.city_code = c.city_code AND substr(c.postal_code, 1, 4) = d.postal_digits"
    threshold: 99
    owner: محلل الجودة
  - {id: R17, cde: inspections.outcome, dimension: الاكتمال, table: inspections, type: not_null, column: outcome, threshold: 100, owner: محلل الجودة}
  - {id: R18, cde: inspections.inspection_date, dimension: التوقيت, table: inspections, type: row, must: "entered_at <= inspection_date + INTERVAL 5 DAY", threshold: 95, owner: محلل الجودة}
  - {id: R19, cde: inspections.outcome, dimension: الاتساق, table: inspections, type: reference, column: licence_no, ref_table: licences, ref_column: licence_no, threshold: 100, owner: محلل الجودة}
  - {id: R20, cde: inspections.inspection_date, dimension: الصلاحية, table: inspections, type: row, must: "inspection_date BETWEEN DATE '2018-01-01' AND DATE '2026-10-31'", threshold: 100, owner: محلل الجودة}
